[package]
name = "ave-actors"
version = "0.13.0"
edition = "2024"
rust-version = "1.90.0"
authors = ["Averiun Ledger, SL <info@averiun.com>"]
description.workspace = true
readme.workspace = true
homepage = "https://averiun.com"
license = "Apache-2.0"
keywords.workspace = true
repository = "https://github.com/Averiun-Ledger/ave-actors"

[dependencies]
ave-actors-actor = { path = "actor", version = "0.6.0" }
ave-actors-store = { path = "store", version = "0.6.0" }
ave-actors-rocksdb = { path = "databases/rocksdb_db", version = "0.5.0", optional = true }
ave-actors-sqlite = { path = "databases/sqlite_db", version = "0.7.0", optional = true }
prometheus-client = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[features]
default = ["sqlite"]
rocksdb = ["dep:ave-actors-rocksdb", "ave-actors-rocksdb/rocksdb"]
export-rocksdb = ["dep:ave-actors-rocksdb", "ave-actors-rocksdb/export-rocksdb"]
sqlite = ["dep:ave-actors-sqlite", "ave-actors-sqlite/sqlite"]
export-sqlite = ["dep:ave-actors-sqlite", "ave-actors-sqlite/export-sqlite"]
prometheus = [
    "dep:prometheus-client",
    "dep:tokio-util",
    "ave-actors-actor/prometheus",
    "ave-actors-store/prometheus",
]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
async-trait = { workspace = true }
tracing = { workspace = true }

[workspace]
members = [
    "actor",
    "store",
    "databases/rocksdb_db",
    "databases/sqlite_db",
]
default-members = [
    ".",
    "actor",
    "store",
    "databases/rocksdb_db",
    "databases/sqlite_db",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.90.0"
authors = ["Averiun Ledger, SL <info@averiun.com>"]
description = "Async actor framework on Tokio with supervision and event-sourced persistence"
readme = "README.md"
homepage = "https://averiun.com"
license = "Apache-2.0"
keywords = ["actor-model", "tokio", "event-sourcing", "persistence", "supervision"]
repository = "https://github.com/Averiun-Ledger/ave-actors"

[workspace.dependencies]
async-trait = { version = "0.1.89" }
ave-actors-actor = { path = "actor", version = "0.6.0" }
ave-actors-rocksdb = { path = "databases/rocksdb_db", version = "0.5.0" }
ave-actors-sqlite = { path = "databases/sqlite_db", version = "0.7.0" }
ave-actors-store = { path = "store", version = "0.6.0" }
borsh = { version = "1.7.0", features = ["derive"] }
dashmap = "6.2.1"
fastrand = "2.4.1"
memsecurity = { version = "3.5.2", features = ["encryption"] }
prometheus-client = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.27.0"
test-log = { version = "0.2.21", features = ["trace"] }
thiserror = { version = "2.0.18" }
tokio = { version = "1.52.3" }
tokio-util = { version = "0.7.18" }
tracing = { version = "0.1.44" }
tracing-test = "0.2.6"
zeroize = "1.9.0"
